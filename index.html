<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHEMTECH HRM</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --p:#0284c7;--pd:#0369a1;--pl:#e0f2fe;--pll:#f0f9ff;
  --sb:#0f172a;--sb2:#1e293b;--sbt:#94a3b8;
  --bg:#f0f9ff;--white:#fff;--bdr:#e2e8f0;
  --txt:#0f172a;--muted:#64748b;
  --sh:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05);
  --shm:0 4px 12px rgba(0,0,0,.08);
  --r:12px;--rs:8px
}
body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
/* ── Layout ── */
.layout{display:flex;min-height:100vh}
/* ── Sidebar ── */
.sidebar{width:240px;background:var(--sb);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;transition:width .2s}
.sb-logo{padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.06)}
.sb-logo .li{margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.15)}.sb-logo .li img{width:203px;height:auto;display:block}
.sb-logo h1{font-size:15px;font-weight:700;color:#fff;line-height:1.2}
.sb-logo p{font-size:11px;color:#64748b;margin-top:2px}
.sb-nav{flex:1;padding:10px 0;overflow-y:auto}
.nav-sec{padding:10px 18px 4px;font-size:10px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.8px}
.ni{display:flex;align-items:center;gap:10px;padding:10px 18px;cursor:pointer;font-size:14px;font-weight:500;color:var(--sbt);border-left:3px solid transparent;transition:all .15s;white-space:nowrap;overflow:hidden}
.ni:hover{background:rgba(255,255,255,.05);color:#fff}
.ni.active{background:rgba(2,132,199,.18);color:#38bdf8;border-left-color:#38bdf8}
.ni .ico{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.sb-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.06)}
.conn-status{display:flex;align-items:center;gap:8px;font-size:11px;color:#64748b}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot.on{background:#10b981}.dot.off{background:#f59e0b}
/* ── Main ── */
.main{margin-left:240px;flex:1;min-height:100vh;padding:28px 30px}
/* ── Page header ── */
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:24px}
.ph h2{font-size:22px;font-weight:700}
.ph p{font-size:13px;color:var(--muted);margin-top:2px}
.ph-actions{display:flex;gap:8px;flex-shrink:0}
/* ── Stats ── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.sc{background:var(--white);border-radius:var(--r);padding:13px 12px;box-shadow:var(--sh);display:flex;align-items:center;gap:10px}
.sc-ic{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.ic-b{background:#dbeafe}.ic-g{background:#d1fae5}.ic-r{background:#ffe4e6}.ic-y{background:#fef3c7}.ic-v{background:#ede9fe}.ic-t{background:#ccfbf1}
.sc-info h3{font-size:20px;font-weight:700;line-height:1;margin-bottom:3px}
.sc-info .lb{font-size:11px;color:var(--muted);font-weight:500}
.sc-b h3{color:#1d4ed8}.sc-g h3{color:#059669}.sc-r h3{color:#dc2626}.sc-y h3{color:#d97706}.sc-v h3{color:#7c3aed}.sc-t h3{color:#0f766e}
/* ── Card ── */
.card{background:var(--white);border-radius:var(--r);padding:20px;box-shadow:var(--sh);margin-bottom:20px}
/* ── Chart ── */
.chart-card{background:var(--white);border-radius:var(--r);padding:20px;box-shadow:var(--sh);margin-bottom:20px}
.chart-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.chart-top h3{font-size:15px;font-weight:700}
.chart-controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.leg{display:flex;align-items:center;gap:5px}
.ldot{width:10px;height:10px;border-radius:50%;display:inline-block}
select.yr{padding:6px 10px;border:1.5px solid var(--bdr);border-radius:7px;font:13px 'Sarabun',sans-serif;color:var(--txt);outline:none;background:#fff;cursor:pointer}
select.yr:focus{border-color:var(--p)}
/* ── Table section ── */
.tbl-card{background:var(--white);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin-bottom:20px}
.tbl-toolbar{padding:14px 18px;border-bottom:1px solid var(--bdr);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.srch{display:flex;align-items:center;gap:8px;background:var(--pll);border:1.5px solid var(--bdr);border-radius:8px;padding:7px 12px;flex:1;min-width:200px;max-width:300px}
.srch input{border:none;background:transparent;font:14px 'Sarabun',sans-serif;color:var(--txt);outline:none;width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 12px;border-radius:20px;border:1.5px solid var(--bdr);background:#fff;cursor:pointer;font:12px 'Sarabun',sans-serif;color:var(--muted);transition:all .15s;white-space:nowrap}
.chip.active{background:var(--p);border-color:var(--p);color:#fff}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead tr{background:var(--pll)}
th{padding:10px 14px;text-align:left;font-size:12px;font-weight:700;color:var(--pd);white-space:nowrap;border-bottom:2px solid var(--pl)}
td{padding:11px 14px;font-size:13px;color:var(--txt);border-bottom:1px solid #f8fafc;white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--pll)}
/* ── Badge ── */
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.ba{background:#d1fae5;color:#065f46}
.br{background:#ffe4e6;color:#9f1239}
/* ── Buttons ── */
.btn{padding:8px 18px;border-radius:var(--rs);border:none;cursor:pointer;font:600 13px 'Sarabun',sans-serif;transition:all .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-p{background:var(--p);color:#fff}.btn-p:hover{background:var(--pd)}
.btn-g{background:#f1f5f9;color:#475569;border:none}.btn-g:hover{background:#e2e8f0}
.btn-sm{padding:5px 11px;font-size:12px;border-radius:6px}
.btn-ed{background:#dbeafe;color:#1d4ed8}.btn-ed:hover{background:#bfdbfe}
.btn-del{background:#ffe4e6;color:#dc2626}.btn-del:hover{background:#fecaca}
/* ── Form ── */
.form-card{background:var(--white);border-radius:var(--r);padding:24px;box-shadow:var(--sh)}
.fsec{font-size:13px;font-weight:700;color:var(--pd);padding-bottom:10px;border-bottom:2px solid var(--pl);margin-bottom:16px;margin-top:22px}
.fsec:first-of-type{margin-top:0}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fg3{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg.full{grid-column:1/-1}
label.lb{font-size:12px;font-weight:600;color:#374151}
.req{color:#ef4444}
input[type=text],input[type=email],input[type=date],input[type=number],input[type=password],select,textarea{width:100%;padding:9px 12px;border:1.5px solid var(--bdr);border-radius:7px;font:14px 'Sarabun',sans-serif;color:var(--txt);background:#fafafa;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(2,132,199,.12);background:#fff}
textarea{resize:vertical;min-height:72px}
.form-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;padding-top:18px;border-top:1px solid var(--bdr)}
/* ── Modal ── */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:var(--r);padding:24px;width:100%;max-width:480px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h3{font-size:17px;font-weight:700;margin-bottom:8px}
.modal p{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.7}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.info-box{background:var(--pll);border-radius:8px;padding:12px;font-size:12px;color:var(--pd);margin-bottom:16px;line-height:1.8}
.info-box code{background:var(--pl);padding:1px 5px;border-radius:4px;font-size:11px}
/* ── Toast ── */
.toast{position:fixed;bottom:20px;right:20px;background:#0f172a;color:#fff;padding:11px 18px;border-radius:9px;font-size:13px;font-weight:500;box-shadow:var(--shm);z-index:9999;animation:su .25s ease}
.toast.ok{background:#059669}.toast.err{background:#dc2626}
@keyframes su{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
/* ── Empty ── */
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty .ei{font-size:44px;margin-bottom:10px}
.empty h3{font-size:15px;color:#475569;margin-bottom:5px}
.empty p{font-size:13px}
/* ── Emp code ── */
.ecode{font-family:monospace;font-size:12px;color:var(--p);font-weight:700;background:var(--pll);padding:2px 7px;border-radius:5px}
.emp-name-link:hover{text-decoration:underline}
/* ── Detail view ── */
.detail-row{display:flex;flex-direction:column;gap:4px}
.detail-label{font-size:12px;font-weight:600;color:#374151}
.detail-value{font-size:14px;color:var(--txt)}
/* ── Mobile Header ── */
.mob-header{display:none;position:fixed;top:0;left:0;right:0;height:54px;background:var(--sb);z-index:150;align-items:center;padding:0 14px;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.ham{background:none;border:none;cursor:pointer;padding:8px;color:#94a3b8;font-size:18px;line-height:1;border-radius:6px;display:flex;align-items:center}
.ham:active{background:rgba(255,255,255,.1)}
.mh-logo{flex:1;font-size:14px;font-weight:700;color:#fff}
/* ── Mobile Overlay ── */
.mob-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:105}
.mob-ov.open{display:block}
/* ── Bottom Nav ── */
.bot-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--sb);border-top:1px solid rgba(255,255,255,.07);z-index:150}
.bn-items{display:flex}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 10px;cursor:pointer;color:var(--sbt);font-size:10px;font-weight:500;transition:color .15s;border:none;background:none;font-family:'Sarabun',sans-serif;-webkit-tap-highlight-color:transparent}
.bn-item .bi{font-size:22px;line-height:1.3;display:block}
.bn-item.active{color:#38bdf8}
/* ── Responsive ── */
@media(max-width:1023px){
  .sidebar{width:58px}
  .sb-logo{padding:14px 0;display:flex;justify-content:center;align-items:center}
  .sb-logo .li{margin:0;padding-bottom:0;border-bottom:none}.sb-logo .li img{width:46px;height:auto;display:block}
  .sb-logo h1,.sb-logo p,.ni span:not(.ico),.nav-sec,.conn-lbl{display:none}
  .main{margin-left:58px;padding:22px 24px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .fg3{grid-template-columns:1fr 1fr}
}
@media(max-width:767px){
  .sidebar{width:240px;transform:translateX(-100%);transition:transform .25s ease;z-index:110}
  .sidebar.open{transform:translateX(0)}
  .sidebar.open .sb-logo{padding:20px 18px;display:flex;flex-direction:column;align-items:flex-start}
  .sidebar.open .sb-logo .li{margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.15)}.sidebar.open .sb-logo .li img{width:203px;height:auto}
  .sidebar.open .sb-logo h1,.sidebar.open .sb-logo p{display:block}
  .sidebar.open .ni span:not(.ico),.sidebar.open .nav-sec,.sidebar.open .conn-lbl{display:block}
  .mob-header{display:flex}
  .bot-nav{display:block}
  .main{margin-left:0;padding:70px 14px 76px}
  .ph{flex-direction:column;gap:10px}
  .ph h2{font-size:18px}
  .ph-actions{width:100%;flex-wrap:wrap;gap:6px}
  .stats{grid-template-columns:1fr 1fr}
  .fg2,.fg3{grid-template-columns:1fr}
  .modal{max-height:90vh;overflow-y:auto;padding:18px}
  .modal-foot{flex-wrap:wrap;gap:8px}
  .tbl-toolbar{padding:10px 12px}
  .srch{max-width:none;min-width:0;flex:1}
  .chips{overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  select.yr{font-size:12px;padding:5px 8px}
  .form-foot{flex-wrap:wrap;gap:8px}
}
@media(max-width:480px){
  .main{padding:62px 10px 72px}
  .sc{padding:11px 10px;gap:8px}
  .sc-ic{width:32px;height:32px;font-size:14px}
  .sc-info h3{font-size:17px}
  .ph h2{font-size:16px}
  .form-card{padding:16px}
  .stats{grid-template-columns:1fr 1fr}
}
/* ── Login Page ── */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--sb);padding:20px}
.login-box{background:#fff;border-radius:16px;padding:36px 40px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo .li{line-height:1;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--bdr)}.login-logo .li img{width:305px;height:auto;display:inline-block}
.login-logo h1{font-size:22px;font-weight:700;color:var(--sb)}
.login-logo p{font-size:13px;color:var(--muted);margin-top:4px}
.login-err{background:#ffe4e6;color:#dc2626;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px;text-align:center}
@media(max-width:480px){.login-box{padding:28px 24px}}
/* ── Role badge ── */
.role-admin{background:#dbeafe;color:#1d4ed8;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block}
.role-user{background:#f1f5f9;color:#475569;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block}
/* ── Sidebar user info ── */
.sb-user{padding:10px 14px;background:rgba(255,255,255,.06);border-radius:8px;margin:6px 10px 2px}
.sb-user .un{font-size:13px;font-weight:600;color:#e2e8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user .ur{margin-top:3px}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ── Constants ──────────────────────────────────────────────────
const MTH=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const COMPANIES=['บริษัท เคมเทค อินโนเวชั่น จำกัด','บริษัท เคมเทค อินเตอร์โลจิสติกส์ จำกัด'];
// ── App Config — URL ฝังตรงนี้ ใช้ได้ทุกเครื่อง ─────────────────
const APP_CONFIG={apiUrl:'https://script.google.com/macros/s/AKfycbwWlxLyMhc9PwFi5I6uz9B8hRLn_GH7QSo_ORGol4qshO8v8rQev55HdtvGJDvPVAxRXw/exec'};

// ── State ──────────────────────────────────────────────────────
const S={
  page:'dashboard',
  emps:[],
  editId:null,
  search:'',
  filterSt:'all',
  filterEmpType:'all',
  filterCompany:'all',
  filterDept:'all',
  filterPosition:'all',
  dashYear:new Date().getFullYear(),
  dashCompany:'all',
  dashDept:'all',
  depts:[],
  deptEditId:null,
  deptDelId:null,
  deptSearch:'',
  apiUrl:localStorage.getItem('hrm_api')||APP_CONFIG.apiUrl,
  connected:false,
  loading:false,
  showSetup:false,
  delId:null,
  localBackup:null,
  menuOpen:false,
  user:(function(){try{return JSON.parse(localStorage.getItem('hrm_user')||'null')}catch{return null}})(),
  users:[],
  loginErr:'',
  loginLoading:false,
  userEditId:null,
  userDelId:null,
  trainings:[],
  trainingEditId:null,
  trainingSearch:'',
  trainingDelId:null,
  warnings:[],
  warningEditId:null,
  warningSearch:'',
  warningDelId:null,
  viewId:null,
};

// ── Storage ────────────────────────────────────────────────────
function lload(){try{return JSON.parse(localStorage.getItem('hrm_emps')||'[]')}catch{return[]}}
function lsave(){try{localStorage.setItem('hrm_emps',JSON.stringify(S.emps))}catch{}}
function dload(){try{return JSON.parse(localStorage.getItem('hrm_depts')||'[]')}catch{return[]}}
function dsave(){try{localStorage.setItem('hrm_depts',JSON.stringify(S.depts))}catch{}}
function backupSave(b){try{localStorage.setItem('hrm_backup',JSON.stringify(b))}catch{}}
function backupLoad(){try{const b=localStorage.getItem('hrm_backup');return b?JSON.parse(b):null}catch{return null}}
function backupClear(){try{localStorage.removeItem('hrm_backup')}catch{}}

// ── API (Google Apps Script) ───────────────────────────────────
async function apiFetch(){
  if(!S.apiUrl)return false;
  try{
    const r=await fetch(S.apiUrl+'?action=list',{redirect:'follow'});
    const text=await r.text();
    const d=JSON.parse(text);
    if(d.success){S.emps=d.data;S.connected=true;lsave();return true}
    console.error('apiFetch error:',d);return false;
  }catch(err){console.error('apiFetch exception:',err);S.connected=false;return false}
}
async function apiPost(body){
  if(!S.apiUrl)return false;
  try{
    const r=await fetch(S.apiUrl,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body)});
    const text=await r.text();
    const d=JSON.parse(text);
    if(d.success){await apiFetch();return true}
    console.error('apiPost error:',d);return false;
  }catch(err){console.error('apiPost exception:',err);return false}
}
async function apiDeptFetch(){
  if(!S.apiUrl)return false;
  try{
    const r=await fetch(S.apiUrl+'?action=listDepts',{redirect:'follow'});
    const text=await r.text();
    const d=JSON.parse(text);
    if(d.success){S.depts=d.data;dsave();return true}
    return false;
  }catch(err){console.error('apiDeptFetch exception:',err);return false}
}
async function apiDeptPost(body){
  if(!S.apiUrl)return false;
  try{
    const r=await fetch(S.apiUrl,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body)});
    const d=await r.json();
    if(d.success){await apiDeptFetch();return true}
    return false;
  }catch{return false}
}
async function apiLogin(username,password){
  if(!S.apiUrl)return{success:false,error:'ไม่ได้เชื่อมต่อฐานข้อมูล กรุณาตั้งค่า API URL ก่อน'};
  try{
    const url=S.apiUrl+'?action=login&username='+encodeURIComponent(username)+'&password='+encodeURIComponent(password);
    const r=await fetch(url,{redirect:'follow'});
    return JSON.parse(await r.text());
  }catch{return{success:false,error:'เชื่อมต่อไม่ได้ กรุณาลองใหม่'}}
}
async function apiUserFetch(){
  if(!S.apiUrl||!isAdmin())return false;
  try{
    const r=await fetch(S.apiUrl+'?action=listUsers',{redirect:'follow'});
    const d=JSON.parse(await r.text());
    if(d.success){S.users=d.data;return true}
    return false;
  }catch{return false}
}
async function apiUserPost(body){
  if(!S.apiUrl)return{success:false,error:'ไม่ได้เชื่อมต่อ'};
  try{
    const r=await fetch(S.apiUrl,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body)});
    return JSON.parse(await r.text());
  }catch{return{success:false,error:'เชื่อมต่อไม่ได้'}}
}
async function apiWarningFetch(){
  if(!S.apiUrl)return false;
  try{
    const r=await fetch(S.apiUrl+'?action=listWarnings',{redirect:'follow'});
    const d=JSON.parse(await r.text());
    if(d.success){S.warnings=d.data;return true}
    return false;
  }catch{return false}
}
async function apiWarningPost(body){
  if(!S.apiUrl)return{success:false,error:'ไม่ได้เชื่อมต่อ'};
  try{
    const r=await fetch(S.apiUrl,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body)});
    return JSON.parse(await r.text());
  }catch{return{success:false,error:'เชื่อมต่อไม่ได้'}}
}
async function apiTrainingFetch(){
  if(!S.apiUrl)return false;
  try{

// ── Helpers ────────────────────────────────────────────────────
function uid(){return'E'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,5).toUpperCase()}
function duid(){return'D'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,4).toUpperCase()}
function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function pdate(s){
  if(!s)return null;
  const str=String(s).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(str)){const d=new Date(str.substring(0,10)+'T00:00:00');return isNaN(d)?null:d}
  const dmy=str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(dmy){const d=new Date(`${dmy[3]}-${dmy[2].padStart(2,'0')}-${dmy[1].padStart(2,'0')}T00:00:00`);return isNaN(d)?null:d}
  const d=new Date(str);return isNaN(d)?null:d;
}
function fdate(d){
  if(!d)return'-';
  const dt=pdate(d);if(!dt)return String(d);
  return String(dt.getDate()).padStart(2,'0')+'/'+String(dt.getMonth()+1).padStart(2,'0')+'/'+dt.getFullYear();
}
function toInputDate(d){
  if(!d)return'';
  const dt=pdate(d);if(!dt)return'';
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}
function calcAge(birthDate){
  const b=pdate(birthDate);if(!b)return'-';
  const t=new Date();
  let y=t.getFullYear()-b.getFullYear();
  if(t.getMonth()<b.getMonth()||(t.getMonth()===b.getMonth()&&t.getDate()<b.getDate()))y--;
  return y>=0?`${y} ปี`:'-';
}
function tenure(startDate,endDate){
  const s=pdate(startDate);if(!s)return'-';
  const eRaw=endDate?pdate(endDate):new Date();
  if(!eRaw||eRaw<s)return'-';
  const e=new Date(eRaw.getTime()+86400000); // +1 วัน (นับวันเริ่มงานด้วย)
  let y=e.getFullYear()-s.getFullYear();
  let m=e.getMonth()-s.getMonth();
  let d=e.getDate()-s.getDate();
  if(d<0){m--;d+=new Date(e.getFullYear(),e.getMonth(),0).getDate()}
  if(m<0){y--;m+=12}
  if(y===0&&m===0)return`${d} วัน`;
  if(y===0)return`${m} เดือน ${d} วัน`;
  if(m===0)return`${y} ปี`;
  return`${y} ปี ${m} เดือน`;
}
function toast(msg,type=''){
  document.querySelectorAll('.toast').forEach(e=>e.remove());
  const el=document.createElement('div');
  el.className='toast'+(type?' '+type:'');el.textContent=msg;
  document.body.appendChild(el);setTimeout(()=>el.remove(),3000)
}

// ── Chart ──────────────────────────────────────────────────────
// วันที่แบ่งพนักงานเดิม / พนักงานใหม่
const EMP_CUTOFF=new Date('2025-12-21T00:00:00');

function buildChart(year,emps){
  if(!emps)emps=S.emps;
  const hi=new Array(12).fill(0);
  const reOld=new Array(12).fill(0); // พนักงานเดิม (เริ่มก่อน 21/12/2025)
  const reNew=new Array(12).fill(0); // พนักงานใหม่ (เริ่มตั้งแต่ 21/12/2025)
  emps.forEach(e=>{
    const sd=pdate(e.startDate);
    if(sd&&sd.getFullYear()===year)hi[sd.getMonth()]++;
    if(e.status==='resigned'&&e.resignDate){
      const rd=pdate(e.resignDate);
      if(rd&&rd.getFullYear()===year){
        if(sd&&sd<EMP_CUTOFF)reOld[rd.getMonth()]++;
        else reNew[rd.getMonth()]++;
      }
    }
  });
  const maxV=Math.max(...hi,...reOld.map((v,i)=>v+reNew[i]),5);
  const rmax=Math.ceil(maxV/5)*5;
  const W=820,H=170,PL=36,PB=24,cH=H-PB-8,cW=W-PL-10;
  const colW=cW/12;const bW=Math.min(colW*0.36,18);
  let g='',bars='';
  for(let i=0;i<=5;i++){
    const v=Math.round(i/5*rmax);const y=8+cH-(i/5)*cH;
    g+=`<line x1="${PL}" y1="${y}" x2="${W-10}" y2="${y}" stroke="#f0f9ff" stroke-width="1"/>`;
    g+=`<text x="${PL-4}" y="${y+3.5}" text-anchor="end" font-size="9" fill="#94a3b8">${v}</text>`;
  }
  for(let i=0;i<12;i++){
    const cx=PL+(i+0.5)*colW;const bY=8+cH;
    const hH=hi[i]?(hi[i]/rmax)*cH:0;
    const roH=reOld[i]?(reOld[i]/rmax)*cH:0;
    const rnH=reNew[i]?(reNew[i]/rmax)*cH:0;
    const rTotal=reOld[i]+reNew[i];
    const rTotalH=roH+rnH;
    const hx=cx-bW-1,rx=cx+1;
    // แท่งรับเข้า (น้ำเงิน)
    if(hi[i]>0){bars+=`<rect x="${hx}" y="${bY-hH}" width="${bW}" height="${hH}" rx="3" fill="#0ea5e9"/>`;bars+=`<text x="${hx+bW/2}" y="${bY-hH-4}" text-anchor="middle" font-size="9" fill="#0284c7" font-weight="700">${hi[i]}</text>`}
    else{bars+=`<rect x="${hx}" y="${bY-2}" width="${bW}" height="2" rx="1" fill="#e2e8f0"/>`}
    // แท่งลาออก stacked (เดิม=แดง ล่าง, ใหม่=ส้ม บน)
    if(rTotal>0){
      // วาด base ด้วยสีแดง (พนักงานเดิม) เต็มความสูงรวม
      bars+=`<rect x="${rx}" y="${bY-rTotalH}" width="${bW}" height="${rTotalH}" rx="3" fill="#f43f5e"/>`;
      // วาดทับส่วนบนด้วยสีส้ม (พนักงานใหม่)
      if(rnH>0)bars+=`<rect x="${rx}" y="${bY-rTotalH}" width="${bW}" height="${rnH}" rx="3" fill="#f97316"/>`;
      bars+=`<text x="${rx+bW/2}" y="${bY-rTotalH-4}" text-anchor="middle" font-size="9" fill="#9f1239" font-weight="700">${rTotal}</text>`;
    }else{bars+=`<rect x="${rx}" y="${bY-2}" width="${bW}" height="2" rx="1" fill="#e2e8f0"/>`}
    bars+=`<text x="${cx}" y="${bY+16}" text-anchor="middle" font-size="10" fill="#64748b">${MTH[i]}</text>`;
  }
  return`<svg viewBox="0 0 ${W} ${H+10}" style="width:100%;height:auto;display:block;overflow:visible">
    ${g}
    <line x1="${PL}" y1="8" x2="${PL}" y2="${8+cH}" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="${PL}" y1="${8+cH}" x2="${W-10}" y2="${8+cH}" stroke="#e2e8f0" stroke-width="1.5"/>
    ${bars}
  </svg>`;
}

function renderDash(){
  const now=new Date();
  const thisYear=now.getFullYear();

  // กรองตามบริษัท + แผนก
  let emps=S.emps;
  if(S.dashCompany!=='all')emps=emps.filter(e=>e.company===S.dashCompany);
  if(S.dashDept!=='all')emps=emps.filter(e=>e.department===S.dashDept);

  // ปีปัจจุบัน = 21/12 ปีที่แล้ว ถึง 21/12 ปีนี้
  const periodStart=new Date(thisYear-1,11,21); // 21 ธ.ค. ปีก่อน (รวมวันนี้)
  const periodEnd=new Date(thisYear,11,20);      // 20 ธ.ค. ปีนี้ (รวมวันนี้)
  // Stats 7 หัวข้อ
  const active=emps.filter(e=>e.status==='active').length;
  const pctActive=n=>active>0?(n/active*100).toFixed(1)+'%':'—';
  const activeOld=emps.filter(e=>{if(e.status!=='active')return false;const s=pdate(e.startDate);return s&&s<periodStart;}).length;
  const newYear=emps.filter(e=>{if(e.status!=='active')return false;const d=pdate(e.startDate);return d&&d>=periodStart&&d<=periodEnd}).length;
  const resignYear=emps.filter(e=>{
    if(e.status!=='resigned')return false;
    const d=pdate(e.resignDate);return d&&d>=periodStart&&d<=periodEnd;
  }).length;
  // พนักงานผ่านทดลองงาน: เริ่มงานในปีปัจจุบัน, active, อายุงาน >= 119 วัน
  const passedProbation=emps.filter(e=>{
    if(e.status!=='active')return false;
    const s=pdate(e.startDate);
    if(!s||s<periodStart||s>periodEnd)return false;
    return Math.floor((now-s)/86400000)>=119;
  }).length;
  // ฐานพนักงานเดิม (startDate < 21/12/2025) ทุกสถานะ
  const empOldTotal=emps.filter(e=>{const s=pdate(e.startDate);return s&&s<EMP_CUTOFF}).length;
  // ฐานพนักงานใหม่ (startDate >= 21/12/2025) ทุกสถานะ
  const empNewTotal=emps.filter(e=>{const s=pdate(e.startDate);return s&&s>=EMP_CUTOFF}).length;
  const pctOld=n=>empOldTotal>0?(n/empOldTotal*100).toFixed(1)+'%':'—';
  const pctNew=n=>empNewTotal>0?(n/empNewTotal*100).toFixed(1)+'%':'—';
  // พนักงานเดิมลาออกในรอบปี (resignDate ในรอบปี + startDate < periodStart)
  const resignOld=emps.filter(e=>{
    if(e.status!=='resigned')return false;
    const s=pdate(e.startDate),r=pdate(e.resignDate);
    if(!s||!r)return false;
    if(r<periodStart||r>periodEnd)return false;
    return s<periodStart;
  }).length;
  // ลาออกช่วงทดลองงาน (resignDate ในรอบปี + เป็นพนักงานใหม่ + อายุงาน < 119 วัน)
  const probationResign=emps.filter(e=>{
    if(e.status!=='resigned')return false;
    const s=pdate(e.startDate),r=pdate(e.resignDate);
    if(!s||!r)return false;
    if(r<periodStart||r>periodEnd)return false;
    if(s<periodStart)return false;
    return Math.floor((r-s)/86400000)<119;
  }).length;
  // ลาออกหลังผ่านทดลองงาน (resignDate ในรอบปี + เป็นพนักงานใหม่ + อายุงาน >= 119 วัน)
  const afterProbation=emps.filter(e=>{
    if(e.status!=='resigned')return false;
    const s=pdate(e.startDate),r=pdate(e.resignDate);
    if(!s||!r)return false;
    if(r<periodStart||r>periodEnd)return false;
    if(s<periodStart)return false;
    return Math.floor((r-s)/86400000)>=119;
  }).length;

  // ปีสำหรับ chart dropdown
  const yrs=new Set([thisYear,thisYear-1,thisYear-2]);
  S.emps.forEach(e=>{if(e.startDate)yrs.add(pdate(e.startDate)?.getFullYear());if(e.resignDate)yrs.add(pdate(e.resignDate)?.getFullYear())});
  const yopts=[...yrs].filter(Boolean).sort((a,b)=>a-b).map(y=>`<option value="${y}"${y===S.dashYear?' selected':''}>${y}</option>`).join('');
  // บริษัทสำหรับ chart dropdown
  const companies=[...new Set(S.emps.map(e=>e.company).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'th'));
  const copts=companies.map(c=>`<option value="${esc(c)}"${S.dashCompany===c?' selected':''}>${esc(c)}</option>`).join('');
  // แผนกสำหรับ chart dropdown (กรองตามบริษัทที่เลือก)
  const relevantDepts=S.dashCompany==='all'?S.depts:S.depts.filter(d=>d.company===S.dashCompany);
  const deptNames=[...new Set(relevantDepts.map(d=>d.name))].sort((a,b)=>a.localeCompare(b,'th'));
  const dopts=deptNames.map(n=>`<option value="${esc(n)}"${S.dashDept===n?' selected':''}>${esc(n)}</option>`).join('');

// ── Employee List ──────────────────────────────────────────────
function renderList(){
  let baseEmps=[...S.emps];
  const q=S.search.toLowerCase();
  if(q)baseEmps=baseEmps.filter(e=>[e.fullName,e.nickname,e.empId,e.department,e.position,e.company].some(v=>(v||'').toLowerCase().includes(q)));
  if(S.filterCompany!=='all')baseEmps=baseEmps.filter(e=>e.company===S.filterCompany);
  if(S.filterDept!=='all')baseEmps=baseEmps.filter(e=>e.department===S.filterDept);
  if(S.filterPosition!=='all')baseEmps=baseEmps.filter(e=>e.position===S.filterPosition);
  // คำนวณช่วงปีปัจจุบัน (21/12 ปีก่อน → 20/12 ปีนี้)
  const _now=new Date(),_yr=_now.getFullYear();
  const _pStart=new Date(_yr-1,11,21),_pEnd=new Date(_yr,11,20);
  const cntOld=baseEmps.filter(e=>{const s=pdate(e.startDate);return s&&s<_pStart}).length;
  const cntNew=baseEmps.filter(e=>{const s=pdate(e.startDate);return s&&s>=_pStart&&s<=_pEnd}).length;
  if(S.filterEmpType==='old')baseEmps=baseEmps.filter(e=>{const s=pdate(e.startDate);return s&&s<_pStart});
  else if(S.filterEmpType==='new')baseEmps=baseEmps.filter(e=>{const s=pdate(e.startDate);return s&&s>=_pStart&&s<=_pEnd});
  let emps=S.filterSt!=='all'?baseEmps.filter(e=>e.status===S.filterSt):[...baseEmps];
  emps.sort((a,b)=>(a.empId||'').localeCompare(b.empId||'',undefined,{numeric:true}));
  const cntAll=baseEmps.length;
  const cntActive=baseEmps.filter(e=>e.status==='active').length;
  const cntResigned=baseEmps.filter(e=>e.status==='resigned').length;

  // Dropdown บริษัท
  const copts=COMPANIES.map(c=>`<option value="${esc(c)}"${S.filterCompany===c?' selected':''}>${esc(c)}</option>`).join('');

  // Dropdown แผนก — กรองตามบริษัทที่เลือก, เรียงตัวอักษร
  const deptPool=S.depts.filter(d=>S.filterCompany==='all'||d.company===S.filterCompany);
  const deptNames=[...new Set(deptPool.map(d=>d.name))].sort((a,b)=>a.localeCompare(b,'th'));
  const dopts=deptNames.map(n=>`<option value="${esc(n)}"${S.filterDept===n?' selected':''}>${esc(n)}</option>`).join('');

  // Dropdown ตำแหน่ง
  const POSITIONS=['พนักงาน','หัวหน้าทีม','หัวหน้างาน','ผู้ช่วยผู้จัดการแผนก','ผู้จัดการแผนก','ผู้จัดการทั่วไป','กรรมการผู้จัดการ'];
  const popts=POSITIONS.map(p=>`<option value="${esc(p)}"${S.filterPosition===p?' selected':''}>${esc(p)}</option>`).join('');

  const hasFilter=S.filterCompany!=='all'||S.filterDept!=='all'||S.filterPosition!=='all'||S.filterEmpType!=='all';

  return`
<div class="ph">
  <div><h2>รายชื่อพนักงาน</h2><p>แสดง ${emps.length} จาก ${S.emps.length} คน</p></div>
  <div class="ph-actions">
    <button class="btn btn-g" onclick="loadData()">↻ รีเฟรช</button>
    ${isAdmin()?`<button class="btn btn-p" onclick="goPage('form')">+ เพิ่มพนักงาน</button>`:''}
  </div>
</div>
<div class="tbl-card">
  <div class="tbl-toolbar" style="flex-direction:column;align-items:stretch;gap:10px">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <div class="srch" style="flex:1;min-width:180px"><span style="color:#94a3b8;font-size:14px">🔍</span>
        <input id="emp-search-inp" type="text" placeholder="ค้นหาชื่อ, รหัส, แผนก..." value="${esc(S.search)}" oninput="setSearch(this.value)">
      </div>
      <div class="chips">
        <button class="chip${S.filterSt==='all'?' active':''}" onclick="setFSt('all')">ทั้งหมด (${cntAll})</button>
        <button class="chip${S.filterSt==='active'?' active':''}" onclick="setFSt('active')">ปัจจุบัน (${cntActive})</button>
        <button class="chip${S.filterSt==='resigned'?' active':''}" onclick="setFSt('resigned')">ลาออกแล้ว (${cntResigned})</button>
        <span style="width:1px;background:var(--bdr);align-self:stretch;margin:0 4px"></span>
        <button class="chip${S.filterEmpType==='all'?' active':''}" onclick="setFEmpType('all')">ทุกประเภท</button>
        <button class="chip${S.filterEmpType==='old'?' active':''}" onclick="setFEmpType('old')">พนักงานเดิม (${cntOld})</button>
        <button class="chip${S.filterEmpType==='new'?' active':''}" onclick="setFEmpType('new')">พนักงานใหม่ (${cntNew})</button>
      </div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:4px;border-top:1px solid var(--bdr)">
      <span style="font-size:12px;font-weight:600;color:var(--muted)">กรอง:</span>
      <div style="display:flex;align-items:center;gap:5px">
        <label style="font-size:12px;color:var(--muted)">บริษัท</label>
        <select class="yr" style="max-width:220px" onchange="setListCompany(this.value)">
          <option value="all"${S.filterCompany==='all'?' selected':''}>ทุกบริษัท</option>
          ${copts}
        </select>
      </div>
      <div style="display:flex;align-items:center;gap:5px">
        <label style="font-size:12px;color:var(--muted)">แผนก</label>
        <select class="yr" onchange="setListDept(this.value)">
          <option value="all"${S.filterDept==='all'?' selected':''}>ทุกแผนก</option>
          ${dopts}
        </select>
      </div>
      <div style="display:flex;align-items:center;gap:5px">
        <label style="font-size:12px;color:var(--muted)">ตำแหน่ง</label>
        <select class="yr" onchange="setListPosition(this.value)">
          <option value="all"${S.filterPosition==='all'?' selected':''}>ทุกตำแหน่ง</option>
          ${popts}
        </select>
      </div>
      ${hasFilter?`<button class="btn btn-sm btn-g" onclick="clearListFilter()" style="font-size:11px">✕ ล้างตัวกรอง</button>`:''}
    </div>
  </div>
  <div class="tbl-wrap">
  ${emps.length?`<table>
    <thead><tr>
      <th>#</th><th>รหัสพนักงาน</th><th>ชื่อ-นามสกุล</th><th>อายุ</th><th>แผนก</th>
      <th>ตำแหน่ง</th><th>วันเริ่มงาน</th><th>อายุงาน</th><th>ผู้บังคับบัญชา</th><th>สถานะ</th>
    </tr></thead>
    <tbody>${emps.map((e,i)=>{const grey=e.status==='resigned';return`<tr style="${grey?'color:#94a3b8':''}" class="emp-row">
      <td style="color:#cbd5e1;font-size:12px">${i+1}</td>
      <td><span class="ecode" style="${grey?'background:#f1f5f9;color:#94a3b8':''}">${esc(e.empId)}</span></td>
      <td style="cursor:pointer" onclick="viewEmp('${e.id}')"><span style="${grey?'':'font-weight:600;color:var(--p)'}" class="emp-name-link">${esc(e.fullName)}</span>${e.nickname?`<span style="font-size:12px;color:${grey?'#cbd5e1':'#64748b'}"> (${esc(e.nickname)})</span>`:''}<br><span style="font-size:11px;color:${grey?'#cbd5e1':'#64748b'}">${esc(e.email||'')}</span></td>
      <td style="text-align:center;font-size:13px">${calcAge(e.birthDate)}</td>
      <td>${esc(e.department||'-')}</td>
      <td>${esc(e.position||'-')}</td>
      <td>${fdate(e.startDate)}</td>
      <td><span style="font-size:12px;color:${e.status==='active'?'#0369a1':'#64748b'};font-weight:600">${tenure(e.startDate,e.status==='resigned'?e.resignDate:null)}</span>${e.status==='resigned'?'<br><span style="font-size:10px;color:#94a3b8">ถึงวันลาออก</span>':''}</td>
      <td>${esc(e.supervisor||'-')}</td>
      <td><span class="badge ${e.status==='active'?'ba':'br'}">${e.status==='active'?'พนักงานปัจจุบัน':'ลาออกแล้ว'}</span>${e.status==='resigned'&&e.resignDate?`<br><span style="font-size:11px;color:#94a3b8">${fdate(e.resignDate)}</span>`:''}</td>
    </tr>`}).join('')}</tbody>
  </table>`:`<div class="empty"><div class="ei">🔍</div><h3>ไม่พบข้อมูล</h3><p>ลองเปลี่ยนคำค้นหา</p></div>`}
  </div>
</div>
`;
}

// ── Training in Employee Profile ──────────────────────────────

  return`<div class="tbl-card" style="margin-top:24px">

  ${list.length?`<div class="tbl-wrap"><table>
    <thead><tr><th>วันที่</th><th>หัวข้อ</th><th>ระยะเวลา</th><th>ค่าใช้จ่าย</th>${isAdmin()?'<th>จัดการ</th>':''}</tr></thead>

      ${isAdmin()?`<td><button class="btn btn-sm btn-ed" onclick="editTraining('${t.id}')">✏️</button></td>`:''}

}

// ── Training List ─────────────────────────────────────────────
function renderTraining(){
  const q=S.trainingSearch.toLowerCase();
  let list=[...S.trainings];
  if(q)list=list.filter(t=>[t.topic,t.duration].some(v=>(v||'').toLowerCase().includes(q)));
  list.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  return`
<div class="ph">
  <div><h2>ประวัติการฝึกอบรม</h2><p>บันทึกการฝึกอบรมพนักงาน (${list.length} รายการ)</p></div>
  <div class="ph-actions">
    <button class="btn btn-g" onclick="apiTrainingFetch().then(()=>render())">↻ รีเฟรช</button>
    ${isAdmin()?`<button class="btn btn-p" onclick="goTrainingForm(null,null)">+ บันทึกการอบรม</button>`:''}
  </div>
</div>
<div class="tbl-card">
  <div class="tbl-toolbar">
    <div class="srch"><span style="color:#94a3b8;font-size:14px">🔍</span>
      <input type="text" placeholder="ค้นหาหัวข้อ..." value="${esc(S.trainingSearch)}" oninput="S.trainingSearch=this.value;render();this.focus()">
    </div>
  </div>
  <div class="tbl-wrap">
  ${list.length?`<table>
    <thead><tr><th>วันที่</th><th>หัวข้อการอบรม</th><th>ระยะเวลา</th><th>รายชื่อพนักงาน</th><th>ค่าใช้จ่าย</th>${isAdmin()?'<th>จัดการ</th>':''}</tr></thead>
    <tbody>${list.map(t=>{
      const ids=(t.employeeIds||'').split(',').map(x=>x.trim()).filter(Boolean);
      const names=ids.map(id=>{const emp=S.emps.find(e=>e.id===id);return emp?esc(emp.fullName):id}).join(', ');
      return`<tr>
        <td style="white-space:nowrap;font-size:13px">${fdate(t.date)}</td>
        <td><strong>${esc(t.topic)}</strong></td>
        <td style="font-size:13px">${esc(t.duration||'-')}</td>
        <td style="font-size:12px;color:#475569">${names||'-'}<br><span style="color:#94a3b8">(${ids.length} คน)</span></td>
        <td style="white-space:nowrap">${t.cost?Number(t.cost).toLocaleString()+' บาท':'-'}</td>
        ${isAdmin()?`<td style="white-space:nowrap">
          <button class="btn btn-sm btn-ed" onclick="editTraining('${t.id}')">✏️</button>
          <button class="btn btn-sm btn-del" onclick="confirmTrainingDel('${t.id}')" style="margin-left:4px">🗑️</button>
        </td>`:''}
      </tr>`;
    }).join('')}</tbody>
  </table>`:`<div class="empty"><div class="ei">📋</div><h3>ยังไม่มีข้อมูล</h3><p>เริ่มบันทึกการอบรมได้เลย</p></div>`}
  </div>
</div>`;
}

// ── Training Form ─────────────────────────────────────────────
function renderTrainingForm(){
  const isEdit=!!S.trainingEditId;
  const t=isEdit?S.trainings.find(x=>x.id===S.trainingEditId)||{}:{};
  const selIds=new Set((t.employeeIds||S._trainingPreFill||'').split(',').map(x=>x.trim()).filter(Boolean));
  const activeEmps=[...S.emps].filter(e=>e.status==='active').sort((a,b)=>(a.empId||'').localeCompare(b.empId||'',undefined,{numeric:true}));
  const grouped={};
  activeEmps.forEach(e=>{
    const key=(e.company||'อื่นๆ')+'|||'+(e.department||'ไม่ระบุแผนก');
    if(!grouped[key])grouped[key]=[];grouped[key].push(e);
  });
  const empRows=Object.entries(grouped).sort(([a],[b])=>a.localeCompare(b,'th')).map(([key,list])=>{
    const [co,dept]=key.split('|||');
    return`<div style="margin-bottom:10px">
      <div style="font-size:11px;color:#94a3b8;margin-bottom:2px">${esc(co)}</div>
      <div style="font-size:13px;font-weight:700;color:var(--pd);margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--bdr)">🏬 ${esc(dept)}</div>
      ${list.map(e=>`<label style="display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer;font-size:13px">
        <input type="checkbox" name="empIds" value="${e.id}" ${selIds.has(e.id)?'checked':''}>
        <span><strong>${esc(e.fullName)}</strong><span style="color:#64748b;font-size:11px"> · ${esc(e.empId)}</span></span>
      </label>`).join('')}
    </div>`;
  }).join('');
  return`
<div class="ph">
  <div><h2>${isEdit?'แก้ไขการอบรม':'บันทึกการอบรม'}</h2><p>${isEdit?esc(t.topic||''):'กรอกข้อมูลการฝึกอบรม'}</p></div>
  <button class="btn btn-g" onclick="goPage('training')">← กลับ</button>
</div>
<form class="form-card" onsubmit="submitTrainingForm(event)">
  <div class="form-grid">
    <div class="fg"><label class="lb">วันที่อบรม <span class="req">*</span></label>
      <input type="date" name="date" value="${esc(toInputDate(t.date))}" required></div>
    <div class="fg"><label class="lb">ระยะเวลา</label>
      <input type="text" name="duration" value="${esc(t.duration||'')}" placeholder="เช่น 1 วัน / 8 ชั่วโมง"></div>
    <div class="fg" style="grid-column:1/-1"><label class="lb">หัวข้อการอบรม <span class="req">*</span></label>
      <input type="text" name="topic" value="${esc(t.topic||'')}" placeholder="ระบุหัวข้อการอบรม" required></div>
    <div class="fg"><label class="lb">ค่าใช้จ่าย (บาท)</label>
      <input type="number" name="cost" min="0" step="0.01" value="${esc(t.cost||'')}" placeholder="0"></div>
  </div>
  <div class="fg" style="margin-top:8px">
    <label class="lb">รายชื่อพนักงานที่เข้าอบรม <span class="req">*</span></label>
    <div style="border:1.5px solid var(--bdr);border-radius:8px;padding:12px;max-height:320px;overflow-y:auto;background:#fafafa;margin-top:6px">
      ${activeEmps.length?empRows:`<p style="color:#94a3b8;font-size:13px;margin:0">ไม่พบพนักงาน</p>`}
    </div>
  </div>
  <div class="form-foot ${isEdit?'justify-content:space-between':''}">
    ${isEdit?`<button type="button" class="btn btn-del" onclick="confirmTrainingDel('${t.id}')">🗑️ ลบ</button>`:''}
    <div style="display:flex;gap:10px">
      <button type="button" class="btn btn-g" onclick="goPage('training')">ยกเลิก</button>
      <button type="submit" class="btn btn-p">${isEdit?'💾 บันทึกการแก้ไข':'✅ บันทึกการอบรม'}</button>
    </div>
  </div>
</form>`;
}

// ── Warning List ──────────────────────────────────────────────

  return`
<div class="ph">
  <div><h2 style="color:#dc2626">⚠️ ประวัติใบเตือน</h2><p>บันทึกประวัติใบเตือนพนักงาน (${list.length} รายการ)</p></div>

// ── Dept List ──────────────────────────────────────────────────
function renderDepts(){
  const q=S.deptSearch.toLowerCase();
  function deptTable(list,idx0){
    if(!list.length)return`<tr><td colspan="5" style="text-align:center;color:#94a3b8;padding:20px">ยังไม่มีแผนก</td></tr>`;
    return list.map((d,i)=>{
      const cnt=S.emps.filter(e=>e.department===d.name&&e.company===d.company&&e.status==='active').length;
      return`<tr>
        <td style="color:#94a3b8;font-size:12px">${idx0+i+1}</td>
        <td><strong style="color:var(--pd)">${esc(d.name)}</strong></td>
        <td>${d.manager?`<span style="font-weight:600">${esc(d.manager)}</span>`:'-'}</td>
        <td><span style="background:var(--pl);color:var(--pd);padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600">${cnt} คน</span></td>
        <td>${isAdmin()?`<button class="btn btn-sm btn-ed" onclick="editDept('${d.id}')" title="แก้ไข">✏️</button>`:''}</td>
      </tr>`;
    }).join('');
  }
  // แผนกที่ยังไม่ได้ระบุบริษัท (ข้อมูลเก่า)
  const unassigned=S.depts.filter(d=>!d.company||!COMPANIES.includes(d.company));
  const allSections=[
    ...COMPANIES.map(co=>({co,label:co.includes('อินโนเวชั่น')?'เคมเทค อินโนเวชั่น':'เคมเทค อินเตอร์โลจิสติกส์'})),
    ...(unassigned.length?[{co:'__none__',label:'ยังไม่ระบุบริษัท ⚠️'}]:[])
  ];
  const sections=allSections.map(({co,label})=>{
    let list=co==='__none__'?[...unassigned]:S.depts.filter(d=>d.company===co);
    if(q)list=list.filter(d=>(d.name||'').toLowerCase().includes(q)||(d.manager||'').toLowerCase().includes(q));
    list.sort((a,b)=>(a.name||'').localeCompare(b.name||'','th'));
    return{co,label,list};
  });
  const totalFiltered=sections.reduce((s,x)=>s+x.list.length,0);
  // single table — columns always aligned
  let rowIdx=0;
  const tbodyRows=sections.map(({co,label,list})=>{
    const isWarn=co==='__none__';
    const hdrBg=isWarn?'#fffbeb':'#f0f9ff';
    const hdrColor=isWarn?'#92400e':'var(--pd)';
    const sectionHdr=`<tr style="background:${hdrBg}">
      <td colspan="6" style="padding:10px 14px;font-size:13px;font-weight:700;color:${hdrColor};border-bottom:2px solid ${isWarn?'#fde68a':'var(--pl)'}">
        🏢 ${esc(label)}
        <span style="margin-left:8px;background:${isWarn?'#fef3c7':'var(--pl)'};color:${hdrColor};padding:1px 9px;border-radius:20px;font-size:11px;font-weight:600">${list.length} แผนก</span>
        ${isWarn?`<span style="margin-left:6px;font-size:11px;font-weight:400">— กรุณาแก้ไขเพื่อระบุบริษัท</span>`:''}
      </td></tr>`;
    const rows=list.length?list.map(d=>{
      const cnt=S.emps.filter(e=>e.department===d.name&&e.company===d.company&&e.status==='active').length;
      const coShort=d.company?d.company.replace('บริษัท ','').replace(' จำกัด',''):'-';
      return`<tr>
        <td style="color:#94a3b8;font-size:12px">${++rowIdx}</td>
        <td style="font-size:12px;color:var(--muted)">${esc(coShort)}</td>
        <td><strong style="color:var(--pd)">${esc(d.name)}</strong></td>
        <td>${d.manager?`<span style="font-weight:600">${esc(d.manager)}</span>`:'-'}</td>
        <td><span style="background:var(--pl);color:var(--pd);padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600">${cnt} คน</span></td>
        <td>${isAdmin()?`<button class="btn btn-sm btn-ed" onclick="editDept('${d.id}')" title="แก้ไข">✏️</button>`:''}</td>
      </tr>`;
    }).join(''):`<tr><td colspan="6" style="text-align:center;color:#94a3b8;padding:14px">ยังไม่มีแผนก</td></tr>`;
    return sectionHdr+rows;
  }).join('');
  const tables=totalFiltered||S.depts.length?`<table>
    <thead><tr><th>#</th><th>บริษัท</th><th>ชื่อแผนก</th><th>ผู้จัดการแผนก</th><th>พนักงานปัจจุบัน</th><th>จัดการ</th></tr></thead>
    <tbody>${tbodyRows}</tbody>
  </table>`:`<div class="empty"><div class="ei">🔍</div><h3>ไม่พบแผนก</h3></div>`;
  return`
<div class="ph">
  <div><h2>ฐานข้อมูลแผนก</h2><p>แผนกทั้งหมด ${S.depts.length} แผนก</p></div>
  ${isAdmin()?`<button class="btn btn-p" onclick="goPage('dept-form')">+ เพิ่มแผนก</button>`:''}
</div>
<div class="tbl-card">
  <div class="tbl-toolbar">
    <div class="srch"><span style="color:#94a3b8;font-size:14px">🔍</span>
      <input id="dept-search-inp" type="text" placeholder="ค้นหาชื่อแผนก, ผู้จัดการ..." value="${esc(S.deptSearch)}" oninput="setDeptSearch(this.value)">
    </div>
  </div>
  <div class="tbl-wrap">
  ${S.depts.length?tables:`<div class="empty"><div class="ei">🏬</div><h3>ยังไม่มีข้อมูลแผนก</h3><p>กดปุ่ม "เพิ่มแผนก" เพื่อเริ่มต้น</p></div>`}
  </div>
</div>
`;
}

// ── Render ─────────────────────────────────────────────────────
function render(){
  if(!S.user){
    document.getElementById('app').innerHTML=renderLogin();
    return;
  }
  let content='';
  if(S.loading){content='<div style="padding:60px;text-align:center;color:#64748b">⏳ กำลังโหลดข้อมูล...</div>'}
  else if(S.page==='dashboard')content=renderDash();
  else if(S.page==='list')content=renderList();
  else if(S.page==='detail')content=renderEmpDetail(S.viewId);
  else if(S.page==='form')content=isAdmin()?renderForm():(S.page='list',renderList());
  else if(S.page==='depts')content=renderDepts();
  else if(S.page==='dept-form')content=isAdmin()?renderDeptForm():(S.page='depts',renderDepts());
  else if(S.page==='users')content=renderUsers();
  else if(S.page==='user-form')content=renderUserForm();
  else if(S.page==='training')content=renderTraining();
  else if(S.page==='training-form')content=isAdmin()?renderTrainingForm():(S.page='training',renderTraining());
  else if(S.page==='warning')content=renderWarning();
  else if(S.page==='warning-form')content=isAdmin()?renderWarningForm():(S.page='warning',renderWarning());

function goPage(p){
  if(!isAdmin()&&(p==='form'||p==='dept-form'||p==='user-form'))return;
  if(!isAdmin()&&p==='users'){p='dashboard'}
  S.page=p;
  S.menuOpen=false;
  if(p!=='form')S.editId=null;
  if(p!=='detail')S.viewId=null;
  if(p!=='dept-form')S.deptEditId=null;
  if(p!=='user-form')S.userEditId=null;
  if(p!=='training-form'){S.trainingEditId=null;S._trainingPreFill='';}
  if(p!=='warning-form')S.warningEditId=null;
  S.delId=null;S.deptDelId=null;S.userDelId=null;S.trainingDelId=null;S.warningDelId=null;

  if(p==='list'){S.filterSt='all';S.filterEmpType='all';S.filterCompany='all';S.filterDept='all';S.filterPosition='all';S.search='';}
  if(p==='users'&&isAdmin()&&!S.users.length)apiUserFetch().then(()=>render());

}

async function doLogin(ev){
  ev.preventDefault();
  const username=document.getElementById('ln-user').value.trim();
  const password=document.getElementById('ln-pass').value;
  if(!username||!password){S.loginErr='กรุณากรอก Username และ Password';render();return}
  S.loginErr='';S.loginLoading=true;render();
  const res=await apiLogin(username,password);
  S.loginLoading=false;
  if(res.success){
    S.user=res.user;
    localStorage.setItem('hrm_user',JSON.stringify(S.user));
    S.loginErr='';
    render();
    if(S.apiUrl){
      S.loading=true;render();
      const tasks=[apiFetch(),apiDeptFetch(),apiTrainingFetch(),apiWarningFetch()];
      if(S.user.role==='admin')tasks.push(apiUserFetch());
      await Promise.all(tasks);
      S.loading=false;render();
    }
  }else{
    S.loginErr=res.error||'เข้าสู่ระบบไม่สำเร็จ';
    render();
  }
}

async function syncLocalToSheets(){
  if(!S.apiUrl||!S.connected){toast('กรุณาเชื่อมต่อ Google Sheets ก่อน','err');return}
  if(!S.emps.length&&!S.depts.length){toast('ไม่มีข้อมูลที่จะอัพโหลด','err');return}
  S.showSetup=false;S.loading=true;render();
  // ดึง ID ที่มีอยู่ใน Sheets แล้ว เพื่อ update แทน create (ป้องกัน duplicate)
  const sheetsEmpIds=new Set(),sheetsDeptIds=new Set();
  try{
    const re=await fetch(S.apiUrl+'?action=list',{redirect:'follow'});
    const de=JSON.parse(await re.text());
    if(de.success)de.data.forEach(e=>sheetsEmpIds.add(e.id));
    const rd=await fetch(S.apiUrl+'?action=listDepts',{redirect:'follow'});
    const dd=JSON.parse(await rd.text());
    if(dd.success)dd.data.forEach(d=>sheetsDeptIds.add(d.id));
  }catch{}
  let ok=0,fail=0;
  for(const d of S.depts){
    const action=sheetsDeptIds.has(d.id)?'updateDept':'createDept';
    try{const r=await fetch(S.apiUrl,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action,data:d})});const resp=JSON.parse(await r.text());if(resp.success)ok++;else fail++}catch{fail++}
  }
  for(const e of S.emps){
    const action=sheetsEmpIds.has(e.id)?'update':'create';
    try{const r=await fetch(S.apiUrl,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action,data:e})});const resp=JSON.parse(await r.text());if(resp.success)ok++;else fail++}catch{fail++}
  }
  S.localBackup=null;backupClear();
  await Promise.all([apiFetch(),apiDeptFetch()]);
  S.loading=false;
  toast(fail===0?`อัพโหลดสำเร็จ ${ok} รายการ`:`สำเร็จ ${ok}, ล้มเหลว ${fail} รายการ`,fail===0?'ok':'err');
  render();
}

  const fd=new FormData(ev.target);
  const empIds=[...ev.target.querySelectorAll('input[name="empIds"]:checked')].map(x=>x.value);
  if(!empIds.length){toast('กรุณาเลือกพนักงานอย่างน้อย 1 คน','err');return}
  const isEdit=!!S.trainingEditId;
  const tr={
    id:isEdit?S.trainingEditId:'T'+Date.now().toString(36).toUpperCase(),
    date:fd.get('date'),
    topic:fd.get('topic').trim(),
    duration:fd.get('duration').trim(),
    employeeIds:empIds.join(','),
    cost:fd.get('cost')||'0',
    createdAt:isEdit?(S.trainings.find(t=>t.id===S.trainingEditId)?.createdAt||new Date().toISOString()):new Date().toISOString(),
    updatedAt:new Date().toISOString(),
  };
  if(isEdit){const i=S.trainings.findIndex(t=>t.id===S.trainingEditId);if(i>-1)S.trainings[i]=tr}
  else S.trainings.unshift(tr);
  const ok=await apiTrainingPost({action:isEdit?'updateTraining':'createTraining',data:tr});
  toast(isEdit?'แก้ไขสำเร็จ':'บันทึกสำเร็จ','ok');
  S.trainingEditId=null;S._trainingPreFill='';S.page='training';render();
}

// ── Init ───────────────────────────────────────────────────────
S.emps=lload();
S.depts=dload();
S.localBackup=backupLoad();
render();
if(S.user&&S.apiUrl){
  S.loading=true;render();
  const tasks=[apiFetch(),apiDeptFetch(),apiTrainingFetch()];
  if(S.user.role==='admin')tasks.push(apiUserFetch());
  Promise.all(tasks).then(()=>{S.loading=false;render()});
}
</script>
</body>
</html>
